<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Downloader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <header>
      <div class="brand">
        <div class="brand-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
            <polygon points="5,3 19,12 5,21"/>
          </svg>
        </div>
        <span>Media Downloader</span>
      </div>
    </header>

    <section class="hero">
      <h1>Download Videos</h1>
      <p class="subtitle">Paste a YouTube or Instagram link and press Enter to fetch quality options</p>

      <form class="search-bar" id="searchForm">
        <input
          type="text"
          id="urlInput"
          placeholder="Paste a YouTube or Instagram link…"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit" id="searchBtn" aria-label="Fetch video">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </form>

      <p class="error-msg" id="errorMsg"></p>
    </section>

    <section class="result" id="result" hidden>

      <div class="card" id="loadingCard">
        <div class="spinner"></div>
        <p class="loading-text">Fetching video info…</p>
      </div>

      <div class="card video-info" id="videoCard" hidden>
        <img id="thumbnail" src="" alt="thumbnail">
        <div class="video-meta">
          <span class="source-badge" id="sourceBadge" hidden></span>
          <h2 id="videoTitle"></h2>
          <div class="meta-row">
            <span id="videoUploader"></span>
            <span class="sep" id="metaSep">·</span>
            <span id="videoDuration"></span>
          </div>
        </div>
      </div>

      <div class="card formats-card" id="formatsCard" hidden>
        <p class="section-label">Select quality</p>
        <div class="format-list" id="formatList"></div>
        <label class="thumb-toggle">
          <input type="checkbox" id="thumbCheck">
          <span>Also download thumbnail image</span>
        </label>
      </div>

      <div class="downloads" id="downloads"></div>

    </section>

    <template id="downloadTemplate">
      <div class="card progress-card download-item">
        <div class="progress-top">
          <span class="dl-label">Preparing…</span>
          <div class="dl-right">
            <span class="progress-pct dl-pct">0%</span>
            <button class="dl-cancel" type="button" aria-label="Cancel download">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="progress-track">
          <div class="progress-fill dl-fill"></div>
        </div>
        <div class="progress-bottom">
          <span class="dl-speed"></span>
          <span class="dl-eta"></span>
        </div>
      </div>
    </template>
  </div>

  <script src="script.js"></script>
</body>
</html>
